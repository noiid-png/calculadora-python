<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora Python Pro</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background-color: #1e1e2e; color: white; margin: 0; }
        .calculadora { background-color: #282a36; padding: 20px; border-radius: 10px; box-shadow: 0px 10px 30px rgba(0,0,0,0.5); width: 300px; }
        #tela { width: 100%; height: 50px; background-color: #44475a; color: #f8f8f2; font-size: 24px; text-align: right; border: none; border-radius: 5px; margin-bottom: 20px; padding: 5px 10px; box-sizing: border-box; }
        .botoes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { padding: 15px; font-size: 18px; font-weight: bold; background-color: #6272a4; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #50fa7b; color: #282a36; }
        .botao-igual { background-color: #ff79c6; grid-column: span 2; }
        .botao-limpar { background-color: #ff5555; grid-column: span 2; }
        #status { margin-top: 10px; font-size: 12px; color: #50fa7b; }
    </style>
</head>
<body>

    <div class="calculadora">
        <input type="text" id="tela" placeholder="Carregando Python..." readonly>
        <div class="botoes">
            <button py-click="lambda e: digitar('7')">7</button>
            <button py-click="lambda e: digitar('8')">8</button>
            <button py-click="lambda e: digitar('9')">9</button>
            <button py-click="lambda e: digitar('/')">/</button>
            <button py-click="lambda e: digitar('4')">4</button>
            <button py-click="lambda e: digitar('5')">5</button>
            <button py-click="lambda e: digitar('6')">6</button>
            <button py-click="lambda e: digitar('*')">*</button>
            <button py-click="lambda e: digitar('1')">1</button>
            <button py-click="lambda e: digitar('2')">2</button>
            <button py-click="lambda e: digitar('3')">3</button>
            <button py-click="lambda e: digitar('-')">-</button>
            <button py-click="lambda e: digitar('0')">0</button>
            <button py-click="lambda e: digitar('.')">.</button>
            <button py-click="lambda e: digitar('+')">+</button>
            <button class="botao-limpar" py-click="limpar">C</button>
            <button class="botao-igual" py-click="calcular">=</button>
        </div>
    </div>
    <div id="status">Aguarde o motor Python ligar...</div>

    <script type="py">
        from pyscript import document
        
        # Indica que o sistema está pronto
        document.getElementById("status").innerHTML = "Python Conectado! ✅"
        document.getElementById("tela").placeholder = "0"

        tela = document.getElementById("tela")

        def digitar(valor):
            tela.value += str(valor)

        def limpar(event):
            tela.value = ""

        def calcular(event):
            try:
                # O eval resolve a expressão matemática
                resultado = eval(tela.value)
                tela.value = str(resultado)
            except:
                tela.value = "Erro"
    </script>
</body>
</html>
